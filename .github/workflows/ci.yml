name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # -----------------------------------------------------------------------
  # 1. Lint
  # -----------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.4"

      - name: Run ruff
        run: ruff check .

  # -----------------------------------------------------------------------
  # 2. Type check
  # -----------------------------------------------------------------------
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime + mypy
        run: pip install "mypy>=1.9" "numpy>=1.24" "scipy>=1.11" "caproto>=1.1"

      - name: Run mypy
        # Ignore PyQt5/pyqtgraph stubs — they are unavailable in CI without a display
        run: mypy core/ analysis/ config/ --ignore-missing-imports

  # -----------------------------------------------------------------------
  # 3. Tests + coverage
  # -----------------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install virtual display (needed for PyQt5 in CI)
        run: sudo apt-get install -y xvfb libxcb-xinerama0 libxcb-cursor0

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        # Use xvfb-run so Qt can open a display in the headless CI environment
        run: |
          xvfb-run --auto-servernum \
            pytest tests/ \
              --cov=analysis --cov=config --cov=core \
              --cov-report=term-missing \
              --cov-report=xml:coverage.xml \
              -q

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
