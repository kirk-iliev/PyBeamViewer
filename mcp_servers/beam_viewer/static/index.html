<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PyBeamViewer</title>
<style>
  :root {
    --bg: #1e1e2e;
    --surface: #2a2a3c;
    --border: #3a3a4c;
    --text: #cdd6f4;
    --text-dim: #888;
    --accent: #89b4fa;
    --green: #a6e3a1;
    --yellow: #f9e2af;
    --red: #f38ba8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    overflow: hidden;
  }

  /* -- Header bar -------------------------------------------------------- */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .header h1 { font-size: 14px; font-weight: 600; }
  .header-right { display: flex; align-items: center; gap: 16px; font-size: 12px; }

  /* -- Toolbar ----------------------------------------------------------- */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .toolbar label { color: var(--text-dim); }
  .toolbar select {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 6px;
    font-size: 12px;
    cursor: pointer;
  }
  .toolbar select:focus { outline: 1px solid var(--accent); }

  /* -- Main content (image + projections + control panel) ---------------- */
  .main {
    display: grid;
    grid-template-columns: 1fr 280px;
    min-height: 0;
    overflow: hidden;
  }

  /* Image + projection layout:
     +-----------------+----------+
     |   beam image    | V proj   |
     +-----------------+----------+
     |   H proj        |          |
     +-----------------+----------+  */
  .viewer-area {
    display: grid;
    grid-template-columns: 1fr 160px;
    grid-template-rows: 1fr 140px;
    min-height: 0;
    overflow: hidden;
  }

  /* Canvas area */
  .canvas-area {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    background: #111;
  }
  #beamCanvas {
    image-rendering: pixelated;
    max-width: 100%;
    max-height: 100%;
  }
  .no-signal {
    position: absolute;
    color: var(--text-dim);
    font-size: 14px;
    pointer-events: none;
  }

  /* Projection plot canvases */
  .h-proj-area {
    background: #1a1a2a;
    border-top: 1px solid var(--border);
    overflow: hidden;
  }
  .v-proj-area {
    background: #1a1a2a;
    border-left: 1px solid var(--border);
    overflow: hidden;
  }
  .proj-canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .proj-corner {
    background: #1a1a2a;
    border-top: 1px solid var(--border);
    border-left: 1px solid var(--border);
  }

  /* Control panel placeholder */
  .control-panel {
    background: var(--surface);
    border-left: 1px solid var(--border);
    padding: 16px;
    overflow-y: auto;
    font-size: 12px;
  }
  .control-panel h2 {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 12px;
  }
  .panel-placeholder {
    color: var(--text-dim);
    font-style: italic;
    font-size: 11px;
    line-height: 1.6;
    padding: 8px;
    border: 1px dashed var(--border);
    border-radius: 4px;
    margin-bottom: 12px;
  }

  /* -- Status bar -------------------------------------------------------- */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 4px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    font-size: 11px;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 4px;
  }
  .status-dot.connected    { background: var(--green); }
  .status-dot.reconnecting { background: var(--yellow); animation: pulse 1s ease-in-out infinite; }
  .status-dot.disconnected { background: var(--red); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .stat-label { color: var(--text-dim); }
  .stat-value { color: var(--text); font-weight: 600; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1>PyBeamViewer</h1>
  <div class="header-right">
    <span>
      <span class="stat-label">Frame</span>
      <span class="stat-value" id="frameNum">--</span>
    </span>
    <span>
      <span class="stat-label">FPS</span>
      <span class="stat-value" id="fpsVal">--</span>
    </span>
  </div>
</div>

<!-- Toolbar -->
<div class="toolbar">
  <label for="cmapSelect">Colormap</label>
  <select id="cmapSelect">
    <option value="gray">gray</option>
    <option value="hot" selected>hot</option>
    <option value="viridis">viridis</option>
    <option value="inferno">inferno</option>
    <option value="plasma">plasma</option>
    <option value="magma">magma</option>
    <option value="cividis">cividis</option>
  </select>
</div>

<!-- Main content: image canvas + projections + control panel -->
<div class="main">
  <div class="viewer-area">
    <div class="canvas-area">
      <canvas id="beamCanvas" width="640" height="480"></canvas>
      <div class="no-signal" id="noSignal">Waiting for frames...</div>
    </div>
    <div class="v-proj-area">
      <canvas id="vProjCanvas" class="proj-canvas"></canvas>
    </div>
    <div class="h-proj-area">
      <canvas id="hProjCanvas" class="proj-canvas"></canvas>
    </div>
    <div class="proj-corner"></div>
  </div>

  <div class="control-panel">
    <h2>Controls</h2>
    <div class="panel-placeholder">
      Streaming, analysis, ROI, and overlay controls will appear here.
    </div>
    <h2>Analysis</h2>
    <div class="panel-placeholder">
      Beam fit results (sigma, centroid) will appear here.
    </div>
    <h2>Trending</h2>
    <div class="panel-placeholder">
      Trending plots will appear here.
    </div>
  </div>
</div>

<!-- Status bar -->
<div class="status-bar">
  <span>
    <span class="status-dot disconnected" id="statusDot"></span>
    <span id="statusText">Disconnected</span>
  </span>
  <span>
    <span class="stat-label" id="dimLabel"></span>
  </span>
</div>

<!-- Modular JS (order matters: colormaps -> renderer -> projections -> connection -> app) -->
<script src="js/colormaps.js"></script>
<script src="js/renderer.js"></script>
<script src="js/projections.js"></script>
<script src="js/connection.js"></script>
<script src="js/app.js"></script>

</body>
</html>
