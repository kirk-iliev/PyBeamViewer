[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pybeamviewer"
version = "0.1.0"
description = "Real-time beam profile viewer for synchrotron beamlines via EPICS/Channel Access"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PyQt5>=5.15",
    "pyqtgraph>=0.13",
    "numpy>=1.24",
    "scipy>=1.11",
    "caproto>=1.1",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-qt>=4",
    "pytest-subtests>=0.11",
    "mypy>=1.9",
    "ruff>=0.4",
    "types-PyQt5",
]

[project.scripts]
pybeamviewer = "main:main"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--tb=short",
    "-q",
    "--cov=analysis",
    "--cov=config",
    "--cov=core",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["analysis", "config", "core", "api"]
omit = ["*/legacy/*", "*/gui/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 60  # raise gradually as test suite grows

# ---------------------------------------------------------------------------
# Ruff (linter + formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["legacy/", ".venv/", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C90", # mccabe complexity
]
ignore = [
    "B008",  # function-call-in-default-argument (used in Qt callbacks)
    "E501",  # line-too-long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "E731"]   # relax in tests

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true   # caproto / PyQt5 stubs are incomplete
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["legacy/", ".venv/", "tests/"]
